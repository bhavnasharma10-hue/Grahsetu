V.login=function(){
 return '<h2>'+(L=='hi'?'लॉगिन':'Login')+'</h2><div class="card">'+(STEP==0?
 '<input id="ph" type="tel" placeholder="Mobile (91XXXXXXXXXX)"><button class="pri" onclick="sendOtp()">OTP</button>':
 '<input id="cd" type="tel" placeholder="OTP"><button class="pri" onclick="verOtp()">'+(L=='hi'?'सत्यापित करें':'Verify')+'</button>')+
 '<p class="mu" id="lm"></p><label class="mu"><input type="checkbox" id="cs" style="width:auto"> '+(L=='hi'?'मैं गोपनीयता नीति और जन्म-विवरण प्रोसेसिंग के लिए सहमत हूँ':'I consent to the Privacy Policy and processing of my birth details')+'</label></div><button class="btn" style="width:100%" onclick="SKIP=true;draw()">Demo (no login)</button>'};
function msg(m){var e=document.getElementById('lm');if(e)e.textContent=m}
function sendOtp(){PH=document.getElementById('ph').value;if(!document.getElementById('cs').checked)return msg(L=='hi'?'पहले सहमति दें':'Please give consent first');
 fetch('/v1/auth/otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:PH})}).then(function(r){return r.json()}).then(function(d){STEP=1;draw();msg(d.dev_otp?'DEV OTP: '+d.dev_otp:'OTP sent')}).catch(function(){msg('Backend not reachable (run npm start)')})}
function verOtp(){fetch('/v1/auth/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:PH,code:document.getElementById('cd').value})}).then(function(r){return r.json()}).then(function(d){if(d.token){TOK=d.token;try{localStorage.setItem('gs_tok',TOK)}catch(e){}U.name=U.name;go('home')}else msg(d.error||'Error')})}
function logout(){TOK=null;SKIP=false;STEP=0;try{localStorage.removeItem('gs_tok')}catch(e){}draw()}
var _draw=draw;draw=function(){if(!TOK&&!SKIP){S='login'}else if(S=='login'){S='home'}_draw()};
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}
draw();
</script></body></html>
